const typeColors = {'BCP Dealer':'#2a6096','BGN':'#a04020','BSRC':'#5a3a9e'};
function mkIcon(color){
  return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="20" height="26" viewBox="0 0 20 26"><path d="M10 0C4.477 0 0 4.477 0 10c0 7.5 10 16 10 16s10-8.5 10-16C20 4.477 15.523 0 10 0z" fill="${color}" stroke="#fff" stroke-width="1.5"/><circle cx="10" cy="10" r="4" fill="#fff" opacity="0.8"/></svg>`,className:'',iconSize:[20,26],iconAnchor:[10,26],popupAnchor:[0,-26]});
}
function badgeClass(t){return t==='BCP Dealer'?'pp-dealer':t==='BGN'?'pp-bgn':'pp-bsrc'}

const provinces=[...new Set(stations.map(s=>s.province))].sort();
const sel=document.getElementById('provSel');
provinces.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});

let map=L.map('map').setView([17.8,99.6],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);

let markers=[],currentType='all',currentArea='',currentProv='';
function render(){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered=stations.filter(s=>{
    if(currentType!=='all'&&s.type!==currentType&&s.area!==currentType&&!s.area.includes(currentType.replace('สาขา','')))return false;
    if(currentType==='เหนือตอนบน'&&!s.area.includes('ตอนบน'))return false;
    if(currentType==='เหนือตอนล่าง'&&!s.area.includes('ตอนล่าง'))return false;
    if(currentProv&&s.province!==currentProv)return false;
    if(q&&!s.name.toLowerCase().includes(q)&&!s.code.includes(q))return false;
    return true;
  });
  document.getElementById('cnt').textContent=filtered.length;
  filtered.forEach(s=>{
    const m=L.marker([s.lat,s.lng],{icon:mkIcon(typeColors[s.type]||'#888')});
    m.bindPopup(`<div class="pp-title">${s.name}</div><span class="pp-badge ${badgeClass(s.type)}">${s.type}</span><div class="pp-r"><span class="pp-l">รหัส</span><span>${s.code}</span></div><div class="pp-r"><span class="pp-l">จังหวัด</span><span>${s.province}</span></div><div class="pp-r"><span class="pp-l">พื้นที่</span><span>${s.area}</span></div><div class="pp-a">${s.address}</div>`);
    m.addTo(map);markers.push(m);
  });
  if(filtered.length&&(q||currentProv)){const g=L.featureGroup(markers);map.fitBounds(g.getBounds().pad(.15));}
}
document.querySelectorAll('.f-btn').forEach(b=>{
  b.addEventListener('click',function(){
    document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    const v=this.dataset.v;
    if(v==='all'||v==='BCP Dealer'||v==='BGN'||v==='BSRC'){currentType=v;currentArea='';}
    else{currentType=v;currentArea=v;}
    render();
  });
});
document.getElementById('provSel').addEventListener('change',function(){currentProv=this.value;render();});
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
function doSearch(){render();}
render();
</script>
